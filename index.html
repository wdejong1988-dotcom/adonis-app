<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#121212" />
  <meta name="description" content="Van Silenus naar Adonis - 8 weken calisthenics trainingsapp" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" />
  <title>Van Silenus naar Adonis</title>

  <style>
    :root{
      --bg:#0c0c0d;
      --panel:#171719;
      --panel2:#202023;
      --text:#f7f2e8;
      --muted:#aaa59b;
      --gold:#d8aa5b;
      --gold2:#f0c778;
      --green:#63c174;
      --red:#ef6b6b;
      --line:#35353a;
      --shadow:0 10px 35px rgba(0,0,0,.34)
    }

    *{box-sizing:border-box}

    html{
      background:var(--bg);
      color-scheme:dark
    }

    body{
      margin:0;
      background:radial-gradient(circle at 50% -20%,#312512 0,#111 38%,#0b0b0c 72%);
      color:var(--text);
      font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      min-height:100vh
    }

    button{font:inherit}

    .app{
      width:min(760px,100%);
      margin:0 auto;
      padding:env(safe-area-inset-top) 14px calc(92px + env(safe-area-inset-bottom))
    }

    .hero{
      padding:26px 8px 16px;
      text-align:center
    }

    .eyebrow{
      color:var(--gold2);
      text-transform:uppercase;
      letter-spacing:.16em;
      font-size:12px;
      font-weight:800
    }

    .hero h1{
      margin:5px 0 2px;
      font-size:clamp(28px,7vw,44px);
      line-height:1.02
    }

    .subtitle{
      color:var(--muted);
      margin:6px 0 0
    }

    .nav{
      position:fixed;
      z-index:20;
      left:50%;
      bottom:10px;
      transform:translateX(-50%);
      width:min(730px,calc(100% - 20px));
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:6px;
      background:rgba(22,22,24,.92);
      backdrop-filter:blur(18px);
      border:1px solid #2f2f34;
      border-radius:20px;
      padding:7px;
      box-shadow:var(--shadow)
    }

    .nav button{
      border:0;
      background:transparent;
      color:#bcb7ad;
      border-radius:14px;
      padding:11px 8px;
      font-weight:750
    }

    .nav button.active{
      background:#3a2d18;
      color:#ffe2a8
    }

    .screen{display:none}
    .screen.active{display:block}

    .card{
      background:linear-gradient(180deg,#1b1b1e,#151517);
      border:1px solid #2c2c31;
      border-radius:22px;
      padding:18px;
      margin:12px 0;
      box-shadow:var(--shadow)
    }

    .topline{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      background:#2b2417;
      color:#f5cd81;
      border:1px solid #5d4825;
      border-radius:999px;
      padding:6px 10px;
      font-weight:800;
      font-size:12px
    }

    .badge.light{
      background:#17241a;
      color:#9ee5aa;
      border-color:#285c32
    }

    .badge.extra{
      background:#1b2030;
      color:#b9c9ff;
      border-color:#3b4b80
    }

    h2,h3{margin:0}

    .muted{color:var(--muted)}
    .small{font-size:13px}

    .section-title{
      margin:22px 4px 8px;
      font-size:18px
    }

    .week-strip{
      display:flex;
      gap:8px;
      overflow:auto;
      padding:4px 2px 8px;
      scrollbar-width:none
    }

    .week-strip::-webkit-scrollbar{display:none}

    .week-btn{
      flex:0 0 auto;
      border:1px solid #39393e;
      background:#17171a;
      color:#ddd6c9;
      border-radius:13px;
      padding:9px 12px;
      font-weight:800
    }

    .week-btn.active{
      background:var(--gold);
      border-color:var(--gold);
      color:#17120a
    }

    .
